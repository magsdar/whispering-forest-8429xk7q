<h1>
    Utgangspunkt og milepæl
</h1>

<p>Barnet spiser mat fra hver matgruppe og dere jobber fast med eksponering. Barnet kan smake på ny mat på eget
    initiativ
    og spiser etter sin egen kropps behov. Du vet hvordan du skal håndtere vanskelige perioder når de kommer og dere tar
    informerte matvalg.</p>
